on:
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.1.0
    with:
      repository: https://github.com/rwx-cloud/playwright-captain-reporter.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ github.token }}

  - key: tool-versions
    use: code
    call: rwx/tool-versions 1.1.0
    filter:
      - .tool-versions

  # The lowest Node of every major that package.json's `engines` claims, plus .tool-versions
  - key: test
    parallel:
      matrix:
        node-version:
          - "20.1.0"
          - "22.0.0"
          - "${{ tasks.tool-versions.values.nodejs }}"
        playwright-version:
          - "1.50.1"
          - "1.62.1"
    call: ${{ run.dir }}/test-versions.yml
    init:
      node-version: ${{ parallel.node-version }}
      playwright-version: ${{ parallel.playwright-version }}
      commit-sha: ${{ init.commit-sha }}
